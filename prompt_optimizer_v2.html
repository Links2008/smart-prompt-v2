<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Optimizer - AI智能提示词优化</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            --gradient-primary: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #3b82f6 100%);
            --gradient-secondary: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%);
            --gradient-accent: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-medium: 0 8px 30px rgba(0, 0, 0, 0.08);
            --shadow-glow: 0 0 60px rgba(139, 92, 246, 0.15);
            --shadow-elevated: 0 20px 40px rgba(0, 0, 0, 0.12);
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
            
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
            
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        :root[data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #fafafa;
            --bg-tertiary: #f5f5f5;
            --bg-glass: rgba(255, 255, 255, 0.8);
            --bg-glass-hover: rgba(245, 245, 245, 0.9);
            
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --text-accent: #6366f1;
            
            --border-color: rgba(0, 0, 0, 0.08);
            --border-focus: rgba(99, 102, 241, 0.3);
        }

        :root[data-theme="dark"] {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #242424;
            --bg-glass: rgba(30, 30, 30, 0.8);
            --bg-glass-hover: rgba(40, 40, 40, 0.9);
            
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --text-accent: #a5b4fc;
            
            --border-color: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(147, 197, 253, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            transition: background var(--transition-normal);
        }

        ::selection {
            background: rgba(99, 102, 241, 0.3);
            color: var(--text-primary);
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
        }

        .bg-gradient::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -30%;
            width: 160%;
            height: 160%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 60%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 40%),
                radial-gradient(ellipse at 30% 70%, rgba(168, 85, 247, 0.08) 0%, transparent 45%);
            animation: bgFloat 20s ease-in-out infinite;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(2%, 2%) rotate(0.5deg); }
            50% { transform: translate(-1%, -1%) rotate(-0.5deg); }
            75% { transform: translate(1%, -2%) rotate(0.3deg); }
        }

        .main-container {
            display: flex;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .sidebar {
            width: 260px;
            background: var(--bg-glass);
            backdrop-filter: blur(24px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: var(--spacing-sm);
            transition: all var(--transition-normal);
            position: relative;
        }

        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, var(--bg-secondary) 0%, transparent 100%);
            opacity: 0.5;
            pointer-events: none;
        }

        .sidebar-header {
            padding: var(--spacing-sm) var(--spacing-xs);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: var(--spacing-sm);
            position: relative;
            z-index: 1;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-xs);
            border-radius: var(--radius-md);
            transition: background var(--transition-fast);
            cursor: pointer;
        }

        .brand:hover {
            background: var(--bg-tertiary);
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: var(--gradient-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            transition: all var(--transition-fast);
            position: relative;
            overflow: hidden;
        }

        .brand-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .brand-subtitle {
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .new-chat-btn {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--gradient-primary);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-xs);
            transition: all var(--transition-fast);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
            margin-bottom: var(--spacing-md);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .new-chat-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .new-chat-btn:hover::before {
            opacity: 1;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.45);
        }

        .new-chat-btn:active {
            transform: translateY(0);
        }

        .sidebar-divider {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            padding: var(--spacing-xs) var(--spacing-sm);
            margin-bottom: var(--spacing-xs);
            position: relative;
            z-index: 1;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            position: relative;
            z-index: 1;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            color: var(--text-secondary);
            font-size: 0.825rem;
            margin-bottom: 2px;
        }

        .history-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .history-item.active {
            background: rgba(99, 102, 241, 0.12);
            color: var(--text-primary);
        }

        .history-item-icon {
            width: 28px;
            height: 28px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            flex-shrink: 0;
        }

        .history-item.active .history-item-icon {
            background: var(--gradient-primary);
            color: white;
        }

        .history-item-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sidebar-footer {
            padding: var(--spacing-sm);
            border-top: 1px solid var(--border-color);
            margin-top: var(--spacing-sm);
            position: relative;
            z-index: 1;
        }

        .sidebar-footer-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .sidebar-footer-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: statusPulse 2.5s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }

        .theme-toggle {
            margin-left: auto;
            width: 32px;
            height: 32px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .theme-toggle:hover {
            background: var(--bg-glass-hover);
            border-color: var(--border-focus);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .header {
            height: 64px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--spacing-lg);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: all var(--transition-normal);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--spacing-lg);
        }

        .provider-select-wrapper {
            position: relative;
        }

        .provider-select {
            background: transparent;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
            appearance: none;
            min-width: 160px;
        }

        .provider-select:hover {
            background: var(--bg-tertiary);
        }

        .provider-select-wrapper::after {
            content: '\f078';
            font-family: 'Font Awesome 6 Free';
            font-size: 0.6rem;
            color: var(--text-muted);
            position: absolute;
            right: 0;
            pointer-events: none;
        }

        .model-select-wrapper {
            position: relative;
        }

        .model-select {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
            appearance: none;
            min-width: 120px;
        }

        .model-select:hover {
            border-color: var(--border-focus);
        }

        .model-select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .model-select-wrapper::after {
            content: '\f078';
            font-family: 'Font Awesome 6 Free';
            font-size: 0.5rem;
            color: var(--text-muted);
            position: absolute;
            right: 8px;
            pointer-events: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .api-key-wrapper {
            position: relative;
        }

        .api-key-input {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            padding: 8px 14px;
            font-size: 0.8rem;
            color: var(--text-primary);
            width: 200px;
            transition: all var(--transition-fast);
            font-family: var(--font-mono);
        }

        .api-key-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .api-key-input::placeholder {
            color: var(--text-muted);
        }

        .api-key-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.75rem;
            transition: color var(--transition-fast);
        }

        .api-key-toggle:hover {
            color: var(--text-secondary);
        }

        .local-config-wrapper {
            display: none;
            align-items: center;
            gap: var(--spacing-xs);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 6px 12px;
            transition: all var(--transition-fast);
        }

        .local-config-wrapper.active {
            display: flex;
        }

        .local-config-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .local-url-input {
            background: transparent;
            border: none;
            font-size: 0.75rem;
            color: var(--text-primary);
            width: 220px;
            font-family: var(--font-mono);
        }

        .local-url-input:focus {
            outline: none;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-xl);
            padding-bottom: 180px;
            transition: padding var(--transition-normal);
        }

        .chat-messages {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .message {
            display: flex;
            gap: var(--spacing-md);
            animation: messageFadeIn 0.4s ease forwards;
            opacity: 0;
        }

        @keyframes messageFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.9rem;
            font-weight: 700;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .message-avatar.ai {
            background: var(--gradient-primary);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .message-avatar.user {
            background: linear-gradient(135deg, #64748b 0%, #475569 100%);
            box-shadow: 0 4px 15px rgba(100, 116, 139, 0.3);
        }

        .message-content {
            flex: 1;
            padding: var(--spacing-md);
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-soft);
            transition: all var(--transition-fast);
        }

        .message-content:hover {
            box-shadow: var(--shadow-medium);
        }

        .message-content p {
            line-height: 1.75;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .message-content strong {
            color: var(--text-accent);
            font-weight: 600;
        }

        .message-content code {
            background: var(--bg-tertiary);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.85em;
            color: var(--text-accent);
        }

        .message-content pre {
            background: var(--bg-secondary);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            overflow-x: auto;
            margin: var(--spacing-sm) 0;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .message-content pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message.user .message-content {
            background: rgba(99, 102, 241, 0.08);
            border-color: rgba(99, 102, 241, 0.15);
        }

        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: var(--spacing-sm) 0;
        }

        .typing-dot {
            width: 10px;
            height: 10px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(1) { animation-delay: 0ms; }
        .typing-dot:nth-child(2) { animation-delay: 150ms; }
        .typing-dot:nth-child(3) { animation-delay: 300ms; }

        @keyframes typingBounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        .input-container {
            position: fixed;
            bottom: 0;
            left: 260px;
            right: 0;
            padding: var(--spacing-lg);
            background: linear-gradient(to top, var(--bg-primary) 60%, transparent);
            z-index: 200;
            transition: all var(--transition-normal);
        }

        .input-box {
            max-width: 700px;
            margin: 0 auto;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-medium);
            transition: all var(--transition-normal);
            overflow: hidden;
        }

        .input-box:focus-within {
            border-color: #6366f1;
            box-shadow: var(--shadow-medium), 0 0 0 3px rgba(99, 102, 241, 0.1);
            transform: translateY(-1px);
        }

        .input-textarea-wrapper {
            padding: var(--spacing-md);
            padding-bottom: var(--spacing-sm);
        }

        #user-input {
            width: 100%;
            background: transparent;
            border: none;
            font-size: 0.95rem;
            color: var(--text-primary);
            resize: none;
            min-height: 60px;
            max-height: 200px;
            line-height: 1.6;
            font-family: var(--font-sans);
        }

        #user-input:focus {
            outline: none;
        }

        #user-input::placeholder {
            color: var(--text-muted);
        }

        .input-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-xs) var(--spacing-md);
            border-top: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.02);
        }

        .input-hint {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            font-size: 0.725rem;
            color: var(--text-muted);
        }

        .send-btn {
            background: var(--gradient-primary);
            border: none;
            border-radius: var(--radius-full);
            padding: 10px 20px;
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-xs);
            transition: all var(--transition-fast);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
            position: relative;
            overflow: hidden;
        }

        .send-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .send-btn:hover::before {
            opacity: 1;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .footer-note {
            text-align: center;
            font-size: 0.675rem;
            color: var(--text-muted);
            margin-top: var(--spacing-sm);
        }

        .toast-container {
            position: fixed;
            top: var(--spacing-lg);
            right: var(--spacing-lg);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .toast {
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--spacing-sm) var(--spacing-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            box-shadow: var(--shadow-medium);
            animation: toastSlideIn 0.3s ease forwards;
            min-width: 200px;
        }

        .toast.success {
            border-color: rgba(16, 185, 129, 0.3);
            color: #10b981;
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .toast-icon {
            font-size: 0.9rem;
        }

        .toast-message {
            font-size: 0.8rem;
            font-weight: 500;
        }

        @keyframes toastSlideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes toastFadeOut {
            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: fixed;
                left: -100%;
                top: 0;
                bottom: 0;
                z-index: 500;
                transition: left var(--transition-normal);
            }

            .sidebar.open {
                left: 0;
            }

            .sidebar-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(4px);
                z-index: 499;
                opacity: 0;
                visibility: hidden;
                transition: all var(--transition-normal);
            }

            .sidebar-overlay.active {
                opacity: 1;
                visibility: visible;
            }

            .main-content {
                width: 100%;
            }

            .header {
                padding: 0 var(--spacing-md);
                height: 60px;
            }

            .header-left {
                gap: var(--spacing-md);
            }

            .provider-select {
                font-size: 0.85rem;
                min-width: 120px;
            }

            .model-select {
                min-width: 100px;
                font-size: 0.75rem;
            }

            .api-key-input {
                width: 140px;
                font-size: 0.7rem;
            }

            .local-url-input {
                width: 160px;
                font-size: 0.7rem;
            }

            .chat-area {
                padding: var(--spacing-md);
                padding-bottom: 160px;
            }

            .chat-messages {
                gap: var(--spacing-md);
            }

            .message {
                gap: var(--spacing-sm);
            }

            .message-avatar {
                width: 36px;
                height: 36px;
                font-size: 0.75rem;
            }

            .message-content {
                padding: var(--spacing-sm) var(--spacing-md);
            }

            .message-content p {
                font-size: 0.875rem;
            }

            .input-container {
                left: 0;
                padding: var(--spacing-md);
                padding-bottom: calc(var(--spacing-md) + env(safe-area-inset-bottom));
            }

            .input-box {
                border-radius: var(--radius-lg);
            }

            .input-textarea-wrapper {
                padding: var(--spacing-sm) var(--spacing-md);
            }

            #user-input {
                min-height: 50px;
                font-size: 0.875rem;
            }

            .send-btn {
                padding: 8px 16px;
                font-size: 0.8rem;
            }

            .input-hint {
                font-size: 0.65rem;
            }

            .footer-note {
                font-size: 0.6rem;
            }

            .toast-container {
                top: var(--spacing-md);
                right: var(--spacing-md);
            }

            .mobile-menu-btn {
                display: flex;
                width: 36px;
                height: 36px;
                background: var(--bg-tertiary);
                border: 1px solid var(--border-color);
                border-radius: var(--radius-sm);
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: all var(--transition-fast);
                margin-right: var(--spacing-sm);
            }

            .mobile-menu-btn:hover {
                background: var(--bg-glass-hover);
            }
        }

        @media (min-width: 769px) {
            .mobile-menu-btn {
                display: none;
            }
        }
    </style>
</head>
<body data-theme="light">
    <div class="bg-gradient"></div>
    
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    
    <div class="main-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand" onclick="location.reload()">
                    <div class="brand-icon">✨</div>
                    <div class="brand-text">
                        <span class="brand-title">PromptAI</span>
                        <span class="brand-subtitle">Optimizer</span>
                    </div>
                </div>
                <button class="new-chat-btn" onclick="location.reload()">
                    <i class="fa-solid fa-plus"></i>
                    新建优化任务
                </button>
            </div>
            
            <div class="sidebar-divider">最近记录</div>
            
            <div class="history-list">
                <div class="history-item active">
                    <div class="history-item-icon"><i class="fa-solid fa-file-text"></i></div>
                    <span class="history-item-title">优化：小红书文案</span>
                </div>
                <div class="history-item">
                    <div class="history-item-icon"><i class="fa-solid fa-code"></i></div>
                    <span class="history-item-title">优化：Python 代码注释</span>
                </div>
                <div class="history-item">
                    <div class="history-item-icon"><i class="fa-solid fa-list-check"></i></div>
                    <span class="history-item-title">优化：产品需求文档</span>
                </div>
                <div class="history-item">
                    <div class="history-item-icon"><i class="fa-solid fa-pencil"></i></div>
                    <span class="history-item-title">优化：营销邮件</span>
                </div>
            </div>
            
            <div class="sidebar-footer">
                <div class="sidebar-footer-item">
                    <div class="status-dot"></div>
                    <span>系统已就绪</span>
                    <div class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
                        <i class="fa-solid fa-moon" id="themeIcon"></i>
                    </div>
                </div>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <div class="mobile-menu-btn" onclick="toggleSidebar()">
                        <i class="fa-solid fa-bars"></i>
                    </div>
                    <div class="provider-select-wrapper">
                        <select id="provider" onchange="handleProviderChange()" class="provider-select">
                        <option value="doubao">豆包</option>
                        <option value="kimi">Kimi AI</option>
                        <option value="openai">OpenAI</option>
                        <option value="deepseek">DeepSeek</option>
                        <option value="local">Localhost</option>
                    </select>
                    </div>
                    <div class="model-select-wrapper">
                        <select id="model" class="model-select"></select>
                    </div>
                </div>
                
                <div class="header-right">
                    <div class="api-key-wrapper">
                        <input type="password" id="api-key" placeholder="API Key" class="api-key-input">
                        <span class="api-key-toggle" id="apiKeyToggle" onclick="toggleApiKeyVisibility()">
                            <i class="fa-solid fa-eye"></i>
                        </span>
                    </div>
                    <div id="local-port-config" class="local-config-wrapper">
                        <span class="local-config-label">端口:</span>
                        <input type="text" id="local-url" value="http://localhost:11434/v1/chat/completions" class="local-url-input">
                    </div>
                </div>
            </header>
            
            <div class="chat-area">
                <div class="chat-messages" id="chatMessages">
                    <div class="message">
                        <div class="message-avatar ai">M</div>
                        <div class="message-content">
                            <p>你好！我是你的 <strong>Prompt 优化专家</strong>。请输入你的初稿，我会为你增加<strong>上下文、角色设定、输出限制</strong>，并利用 AI 的能力进行深度优化。</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="input-container">
                <div class="input-box">
                    <div class="input-textarea-wrapper">
                        <textarea id="user-input" placeholder="粘贴你的原始 Prompt..."></textarea>
                    </div>
                    <div class="input-footer">
                        <div class="input-hint">
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                            <span>支持自动扩充核心三要素：角色、任务、格式</span>
                        </div>
                        <button class="send-btn" onclick="optimize()">
                            <i class="fa-solid fa-paper-plane"></i>
                            立即优化
                        </button>
                    </div>
                </div>
                <p class="footer-note">注意：本地调用需确保浏览器已允许 CORS 跨域请求</p>
            </div>
        </main>
    </div>
    
    <div class="toast-container" id="toastContainer"></div>

    <script>
        const PROVIDERS = {
            doubao: {
                name: "豆包",
                url: "https://ark.cn-beijing.volces.com/api/v3/chat/completions",
                models: ["doubao-pro-4k", "doubao-lite-4k", "doubao-lite-32k", "doubao-pro-32k"]
            },
            kimi: {
                name: "Kimi AI",
                url: "https://api.moonshot.cn/v1/chat/completions",
                models: ["moonshot-v1-8k", "moonshot-v1-32k", "moonshot-v1-128k"]
            },
            openai: {
                name: "OpenAI",
                url: "https://api.openai.com/v1/chat/completions",
                models: ["gpt-4o", "gpt-4-turbo", "gpt-3.5-turbo"]
            },
            deepseek: {
                name: "DeepSeek",
                url: "https://api.deepseek.com/v1/chat/completions",
                models: ["deepseek-chat"]
            },
            local: {
                name: "Localhost",
                url: "http://localhost:11434/v1/chat/completions",
                models: ["gemma:2b", "llama3:8b", "mistral:7b"]
            }
        };

        function initModelSelect() {
            const provider = document.getElementById('provider').value;
            const modelSelect = document.getElementById('model');
            modelSelect.innerHTML = '';
            
            PROVIDERS[provider].models.forEach(model => {
                const option = document.createElement('option');
                option.value = model;
                option.textContent = model;
                modelSelect.appendChild(option);
            });
        }

        function handleProviderChange() {
            const provider = document.getElementById('provider').value;
            const localPortConfig = document.getElementById('local-port-config');
            
            if (provider === 'local') {
                localPortConfig.classList.add('active');
            } else {
                localPortConfig.classList.remove('active');
            }
            
            initModelSelect();
        }

        function toggleTheme() {
            const root = document.documentElement;
            const currentTheme = root.getAttribute('data-theme');
            const themeIcon = document.getElementById('themeIcon');
            
            if (currentTheme === 'light') {
                root.setAttribute('data-theme', 'dark');
                themeIcon.className = 'fa-solid fa-sun';
                localStorage.setItem('theme', 'dark');
            } else {
                root.setAttribute('data-theme', 'light');
                themeIcon.className = 'fa-solid fa-moon';
                localStorage.setItem('theme', 'light');
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function toggleApiKeyVisibility() {
            const apiKeyInput = document.getElementById('api-key');
            const toggleIcon = document.querySelector('.api-key-toggle i');
            
            if (apiKeyInput.type === 'password') {
                apiKeyInput.type = 'text';
                toggleIcon.className = 'fa-solid fa-eye-slash';
            } else {
                apiKeyInput.type = 'password';
                toggleIcon.className = 'fa-solid fa-eye';
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="toast-icon fa-solid ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
                <span class="toast-message">${message}</span>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'toastFadeOut 0.3s ease forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function optimize() {
            const userInput = document.getElementById('user-input').value;
            if (!userInput.trim()) {
                showToast('请输入要优化的文本', 'error');
                return;
            }

            const provider = document.getElementById('provider').value;
            const model = document.getElementById('model').value;
            const apiKey = document.getElementById('api-key').value;
            
            const chatMessages = document.getElementById('chatMessages');
            
            const userMessageDiv = document.createElement('div');
            userMessageDiv.className = 'message user';
            userMessageDiv.innerHTML = `
                <div class="message-avatar user">你</div>
                <div class="message-content">
                    <p>${userInput.replace(/\n/g, '<br>')}</p>
                </div>
            `;
            chatMessages.appendChild(userMessageDiv);
            
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message';
            loadingDiv.id = 'loading-message';
            loadingDiv.innerHTML = `
                <div class="message-avatar ai">M</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            chatMessages.appendChild(loadingDiv);
            
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // 获取自定义URL（如果有）
                let customUrl = null;
                if (provider === 'local') {
                    customUrl = document.getElementById('local-url').value;
                }
                
                const requestBody = {
                    provider: provider,
                    model: model,
                    api_key: apiKey,
                    custom_url: customUrl,
                    messages: [
                        {
                            role: 'system',
                            content: '你是一个专业的Prompt优化助手，能够将普通文本转换为结构清晰、内容详尽且AI可理解的专业提示词。请根据用户输入的内容，生成包含明确指令、上下文信息、约束条件和预期输出格式的详细Prompt。不要使用任何固定模板或结构化格式，要根据具体内容生成有针对性的优化结果。'
                        },
                        {
                            role: 'user',
                            content: userInput
                        }
                    ],
                    temperature: 1,
                    max_tokens: 2048,
                    stream: false
                };

                // 调用后端API
                const response = await fetch('/api/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `API请求失败: ${response.status}`);
                }

                const data = await response.json();
                const optimizedPrompt = data.choices[0].message.content;

                loadingDiv.innerHTML = `
                    <div class="message-avatar ai">M</div>
                    <div class="message-content">
                        <p>${optimizedPrompt.replace(/\n/g, '<br>')}</p>
                    </div>
                `;
                
                document.getElementById('user-input').value = '';
            } catch (error) {
                console.error('API调用错误:', error);
                loadingDiv.innerHTML = `
                    <div class="message-avatar ai">M</div>
                    <div class="message-content">
                        <p style="color: #ef4444;">优化失败: ${error.message}</p>
                        <p style="color: var(--text-muted); font-size: 0.8rem; margin-top: 8px;">请检查API Key和网络连接</p>
                    </div>
                `;
            } finally {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function init() {
            initModelSelect();
            handleProviderChange();
            
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const themeIcon = document.getElementById('themeIcon');
            themeIcon.className = savedTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            
            document.getElementById('user-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    optimize();
                }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
